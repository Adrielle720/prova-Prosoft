spring.application.name=api

# Segue exatamente o padrao da Aula de Redes Docker: valores default para
# rodar local, sobrescritos por variaveis de ambiente no Docker/AWS.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:provadb}
spring.datasource.username=${DB_USER:usuario}
spring.datasource.password=${DB_PASSWORD:senha}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
