name: CI/CD

# PARTE 1 - Trigger
# Roda em push na main E em pull requests (para o requisito de
# "pipeline de testes disparado por PR").
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:

  # ---------------------------------------------------------------
  # JOB 1: sempre roda (push OU pull_request) - só compila e testa.
  # ---------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run tests with Maven
        run: mvn -B test --file pom.xml
        # Os testes usam H2 (ver src/test/resources/application.properties),
        # entao NAO precisam de Postgres rodando aqui no Actions.

  # ---------------------------------------------------------------
  # JOB 2: só roda em push na main (deploy de verdade) - depende do
  # job de testes ter passado (needs: test).
  # ---------------------------------------------------------------
  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn -B package --file pom.xml -DskipTests

      # PARTE 4 - Deploy com Docker
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/prova-api:${{ github.sha }},${{ secrets.DOCKERHUB_USERNAME }}/prova-api:latest

      # PARTE 5 - Executar comandos remotos via SSH na AWS
      - name: Deploy na AWS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_AWS }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            docker stop prova-api || true
            docker rm --force prova-api || true
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/prova-api:latest
            docker run -d \
              --network=rede \
              -p 8080:8080 \
              --name prova-api \
              -e DB_HOST=postgres-aula \
              -e DB_PORT=5432 \
              -e DB_NAME=provadb \
              -e DB_USER=usuario \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              ${{ secrets.DOCKERHUB_USERNAME }}/prova-api:latest
